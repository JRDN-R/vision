# The fixed ingress relay publishes only host loopback. Cobalt retains its
# internal-only network and namespace firewall; outbound requests MUST traverse
# the public-address validating proxy, including after a Docker/Windows restart.
services:
  cobalt:
    build:
      context: ./cobalt
    image: vision-vortex-cobalt:a636575b09de
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 1536m
    pids_limit: 128
    tmpfs: [/tmp:size=128m]
    network_mode: service:network-policy
    environment:
      API_URL: http://127.0.0.1:9000/
      API_LISTEN_ADDRESS: 0.0.0.0
      HTTP_PROXY: http://egress:8080
      HTTPS_PROXY: http://egress:8080
      NO_PROXY: ''
      DURATION_LIMIT: '7200'
    depends_on:
      network-policy:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:9000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: none
  network-policy:
    build:
      context: .
      dockerfile: vortex-egress-policy.Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 32m
    pids_limit: 16
    tmpfs: [/run:size=1m]
    networks: [engines]
    depends_on: [egress]
    healthcheck:
      test: ['CMD', 'test', '-f', '/run/policy-ready']
      interval: 5s
      timeout: 2s
      retries: 12
    logging:
      driver: none
  ingress:
    build:
      context: .
      dockerfile: vortex-ingress.Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: '65534:65534'
    cpus: 0.25
    mem_limit: 32m
    pids_limit: 32
    ports: ['127.0.0.1:9000:9000']
    # Only the fixed relay gets a publishable bridge. Cobalt has no new route
    # even when restart policies start containers without Compose health gates.
    networks: [engines, ingress]
    depends_on:
      cobalt:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9000/']
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: none
  egress:
    build:
      context: .
      dockerfile: vortex-egress.Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: '65534:65534'
    cpus: 1
    mem_limit: 128m
    pids_limit: 32
    networks: [engines, public]
    working_dir: /app
    command: ['python', '-B', 'vortex_egress.py']
    healthcheck:
      test: ['CMD', 'python', '-B', '-c', "import socket; socket.create_connection(('127.0.0.1',8080),3).close()"]
      interval: 5s
      timeout: 5s
      retries: 6
    logging:
      driver: none
networks:
  engines:
    internal: true
  ingress: {}
  public: {}
