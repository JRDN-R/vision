<script>
(async()=>{
 try{
  const response=await fetch('./Vision.html?v=f56559e111bc',{credentials:'same-origin'});
  if(!response.ok)throw new Error('App unavailable');
  const html=(await response.text()).replace('<button id="downloadAppBtn"','<button id="downloadAppBtn" hidden');
  if(!html.includes('window.FrameRenderer')||!html.includes('id="board"'))throw new Error('Invalid app response');
  // Keep the full app in the top-level document, including its mobile gestures,
  // download controls, and pristine source capture for the offline HTML.
  document.open();document.write(html);document.close();
 }catch(error){
  const loading=document.getElementById('loading'),fallback=document.getElementById('fallback');
  if(loading)loading.hidden=true;if(fallback)fallback.hidden=false;
 }
})();
