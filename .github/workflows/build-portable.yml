name: Build portable Vision

on:
  push:
    branches: [main, feature/qwen-local-rag-20261011, codex/firstupcjax-admins-worker, codex-vision-standalone-20261019, codex/vision-collapsible-title-header-20261019, fix/vision-header-manual-toggle-only-20261019]
    paths:
      - 'web/**'
      - 'vision-pc/standalone*'
      - 'tests/standalone*'
      - 'tests/compact-navigation.py'
      - 'tests/project-naming.test.cjs'
      - 'tests/test_standalone.py'
      - '.github/workflows/build-portable.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: vision-portable-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned Firebase login runtime
        run: bash web/vendor/build-firebase.sh
      - name: Rebuild the portable app from source
        run: python3 web/build.py
      - name: Build and verify standalone HTTPS edition
        run: |
          python3 web/build_standalone.py --no-rebuild
          node --test tests/standalone.test.cjs
          node --test tests/project-naming.test.cjs
          python3 tests/standalone-bundle.py
          python3 -m pip install "Flask>=3.1,<4"
          python3 tests/test_standalone.py
      - name: Upload standalone desktop HTML
        uses: actions/upload-artifact@v4
        with:
          name: Vision-Standalone
          path: Vision-Standalone.html
          retention-days: 30
      - name: Verify Venture page routing and animation
        run: |
          node --test tests/workspace-route.test.cjs
          python3 -m venv /tmp/vision-route-tests
          /tmp/vision-route-tests/bin/pip install playwright==1.51.0
          /tmp/vision-route-tests/bin/python -m playwright install --with-deps chromium
          /tmp/vision-route-tests/bin/python tests/workspace-route-browser.py
          /tmp/vision-route-tests/bin/python tests/compact-navigation.py
      - name: Package reproducible source
        run: tar --exclude=.git -czf /tmp/vision-source.tar.gz .
      - name: Upload portable build
        id: portable
        uses: actions/upload-artifact@v4
        with:
          name: Vision-portable
          path: Vision.html
          retention-days: 14
      - name: Upload matching source
        id: source
        uses: actions/upload-artifact@v4
        with:
          name: Vision-source
          path: /tmp/vision-source.tar.gz
          retention-days: 3
      - name: Write build manifest
        env:
          PORTABLE_ARTIFACT_ID: ${{ steps.portable.outputs.artifact-id }}
          SOURCE_ARTIFACT_ID: ${{ steps.source.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import os, re, json, hashlib, datetime
          from pathlib import Path
          data = Path('Vision.html').read_bytes()
          version = re.search(rb'<meta name="vision-version" content="([^"]+)"', data)[1].decode()
          manifest = {'version': version, 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data), 'file': 'Vision.html', 'sourceCommit': os.environ['GITHUB_SHA'], 'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'runId': os.environ['GITHUB_RUN_ID'], 'portableArtifactId': os.environ['PORTABLE_ARTIFACT_ID'], 'sourceArtifactId': os.environ['SOURCE_ARTIFACT_ID']}
          Path('portable-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Save the generated HTML
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Vision.html index.html venture/index.html venture/manifest.webmanifest portable-manifest.json vision-pc/standalone-manifest.json web/vendor
          if ! git diff --cached --quiet; then
            git commit -m 'Build portable Vision from current sources'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Publish the current branch to GitHub Pages
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
