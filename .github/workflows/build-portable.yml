name: Build portable Vision

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/build-portable.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: vision-portable-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the portable app from source
        run: python3 web/build.py
      - name: Package reproducible source
        run: git archive --format=tar.gz HEAD > /tmp/vision-source.tar.gz
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Vision-portable
          path: Vision.html
          retention-days: 14
      - name: Upload matching source
        uses: actions/upload-artifact@v4
        with:
          name: Vision-source
          path: /tmp/vision-source.tar.gz
          retention-days: 3
      - name: Save the generated HTML
        shell: bash
        run: |
          if ! git diff --quiet -- Vision.html index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Vision.html index.html
            git commit -m 'Build portable Vision from current sources'
            git push origin HEAD:main
          fi
      - name: Publish the current branch to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
