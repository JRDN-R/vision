name: Apply Venture capture fixes
on:
  push:
    branches: [feature/venture-dictation-memory]
    paths: ['.github/workflows/repair-venture-capture.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/venture-dictation-memory
      - name: Validate and apply capture and readiness changes
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          encoded = ''
          ready=[]
          for edit in json.loads(lzma.decompress(base64.b64decode(encoded))):
              assert edit['path'] in ('web/venture-controls.js','web/venture.js','tests/venture-integration.py')
              path=pathlib.Path(edit['path']);text=path.read_text(encoding='utf-8')
              assert hashlib.sha256(text.encode()).hexdigest()==edit['old'],str(path)
              for start,end,replacement in reversed(edit['ops']):text=text[:start]+replacement+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==edit['new'],str(path)
              ready.append((path,text))
          for path,text in ready:path.write_text(text,encoding='utf-8')
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--']+[str(path) for path,_ in ready],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unlock waveform audio during the user gesture and protect drafts until Venture is ready'
          git push origin HEAD:feature/venture-dictation-memory
