name: Test title-eyes
on:
  push:
    branches: [main]
    paths: ['title-eyes/**','web/title-eyes/**','vision-pc/title_eyes.py','vision-pc/title_eyes_standby.py','vision-pc/local_standby.py','vision-pc/test_local_standby.py','vision-pc/media_share.py','vision-pc/media_share_assignments.py','vision-pc/test_media_share.py','vision-pc/test_media_availability.py','vision-pc/test_media_assignments.py','vision-pc/test_obs_activity.py','vision-pc/firebase_auth.py','vision-pc/test_title_eyes.py','vision-pc/server.py','vision-pc/account_administration.py','.github/workflows/test-title-eyes.yml']
  pull_request:
    paths: ['title-eyes/**','web/title-eyes/**','vision-pc/**','tests/title-eyes.test.cjs','.github/workflows/test-title-eyes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  title-eyes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r vision-pc/requirements.txt
      - run: python -m unittest discover -s vision-pc -p test_title_eyes.py -v
      - run: python -m unittest discover -s vision-pc -p test_media_share.py -v
      - run: python -m unittest discover -s vision-pc -p test_media_availability.py -v
      - run: python -m unittest discover -s vision-pc -p test_media_assignments.py -v
      - run: python -m unittest discover -s vision-pc -p test_obs_activity.py -v
      - run: python -m unittest discover -s vision-pc -p test_local_standby.py -v
      - run: python -m unittest discover -s vision-pc -p test_local_inference.py -v
      - run: python -m unittest discover -s vision-pc -p test_firebase_auth.py -v
      - run: node --test tests/title-eyes.test.cjs
