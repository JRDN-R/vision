name: Test Vortex

on:
  push:
    branches: [codex/vortex-media-app]
  pull_request:
    branches: [main]
    paths: ['vortex/**', 'web/**', 'vision-pc/**', 'tests/**', '.github/workflows/test-vortex.yml']

permissions:
  contents: read

concurrency:
  group: vortex-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r vision-pc/requirements.txt
      - name: Install FFmpeg for real export checks (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg for real export checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Get-Command ffmpeg, ffprobe -ErrorAction Stop
      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ParseErrors = $null
          $Tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'vision-pc/Setup-Vision-PC.ps1'), [ref]$Tokens, [ref]$ParseErrors) | Out-Null
          if ($ParseErrors.Count) { throw ($ParseErrors | Out-String) }
      - name: Check isolated specialist dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VortexPackages = Join-Path $env:RUNNER_TEMP 'vortex-packages'
          python -m pip install --only-binary=:all: --target $VortexPackages -r vision-pc/requirements-vortex.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import sys; sys.path.insert(0,sys.argv[1]); import yt_dlp, gallery_dl, spotdl" $VortexPackages
      - name: Vortex persistence, account isolation, network and delivery checks
        run: python -m unittest discover -s vision-pc -p 'test_vortex*.py' -v
      - name: Shared authentication and processor regression checks
        run: |
          python -m unittest discover -s vision-pc -p 'test_firebase_auth.py' -v
          python -m unittest discover -s vision-pc -p 'test_server.py' -v
          python tests/test_context_setup.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python web/build.py
      - name: Vortex mobile, desktop, account and navigation checks
        run: |
          python tests/vortex-browser.py
          python tests/vortex-navigation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vortex-browser-verification
          path: .qa/vortex/
          retention-days: 7
