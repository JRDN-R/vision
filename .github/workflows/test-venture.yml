name: Test Venture
on:
  push:
    branches: [feature/vision-venture, feature/venture-dictation-memory]
  pull_request:
    branches: [main]
    paths: ['web/**', 'vision-pc/**', 'tests/**', '.github/workflows/test-venture.yml']
permissions:
  contents: read
concurrency:
  group: venture-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONWARNINGS: ignore::ResourceWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools and real document fixtures
        run: |
          python -m pip install -r vision-pc/requirements.txt playwright python-docx==1.2.0 python-pptx==1.0.2 openpyxl==3.1.5 pdfplumber==0.11.10 pypdfium2==5.13.0 pytesseract==0.3.13 defusedxml==0.7.1
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr ffmpeg
          mkdir -p tests/venture-logs
      - name: Server regression checks
        run: |
          set -o pipefail
          python -m unittest discover -s vision-pc -p 'test_*.py' -v 2>&1 | tee tests/venture-logs/server.txt
      - name: Build hosted application bundle
        run: |
          set -o pipefail
          python web/build.py 2>&1 | tee tests/venture-logs/build.txt
          python tests/versioning-smoke.py
      - name: Browser-independent JavaScript checks
        run: |
          set -o pipefail
          for test in tests/*.test.cjs; do node "$test" || exit $?; done 2>&1 | tee tests/venture-logs/javascript.txt
      - name: Hosted browser checks
        run: |
          set -o pipefail
          python tests/run-local-smoke.py 2>&1 | tee tests/venture-logs/hosted.txt
      - name: Literal local-file browser checks
        run: |
          set -o pipefail
          VISION_TEST_FILE=1 python tests/run-local-smoke.py 2>&1 | tee tests/venture-logs/local-file.txt
      - name: Venture mobile and desktop browser checks
        run: |
          set -o pipefail
          python tests/venture-smoke.py 2>&1 | tee tests/venture-logs/venture.txt
      - name: Workspace recovery unit and browser checks
        run: |
          set -o pipefail
          python tests/workspace-unit.py 2>&1 | tee tests/venture-logs/workspace-unit.txt
          python tests/workspace-browser.py 2>&1 | tee tests/venture-logs/workspace-browser.txt
          python tests/dictation-export.py 2>&1 | tee tests/venture-logs/dictation-export.txt
      - name: Hosted microphone and server integration
        run: |
          set -o pipefail
          python tests/venture-integration.py 2>&1 | tee tests/venture-logs/integration.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Venture-verification
          path: |
            tests/venture-screenshots/
            tests/venture-logs/
            Vision.html
          retention-days: 7
