name: Test Vision Venture
on:
  push:
    branches: [feature/vision-venture]
  pull_request:
    branches: [main]
    paths: ['web/**', 'vision-pc/**', 'tests/**', '.github/workflows/test-venture.yml']
permissions:
  contents: read
concurrency:
  group: venture-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          python -m pip install -r vision-pc/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Archive portable Python test dependencies
        run: python -m pip download Flask waitress -d /tmp/vision-test-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: Vision-test-wheels
          path: /tmp/vision-test-wheels
          retention-days: 3
      - name: Server regression checks
        run: python -m unittest discover -s vision-pc -p 'test_*.py' -v
      - name: Build portable application
        run: python web/build.py
      - name: Browser-independent JavaScript checks
        run: |
          for test in tests/*.test.cjs; do node "$test"; done
      - name: Hosted and local-file browser checks
        run: |
          python tests/run-local-smoke.py
          VISION_TEST_FILE=1 python tests/run-local-smoke.py
          if [ -f tests/venture-smoke.py ]; then python tests/venture-smoke.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Venture-verification
          path: |
            tests/venture-screenshots/
            Vision.html
          retention-days: 7
