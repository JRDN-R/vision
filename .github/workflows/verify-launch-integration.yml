name: Verify integrated launch update
on:
  push:
    branches: [launch-guest-five-minutes]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vision-launch-integration
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch-guest-five-minutes
          fetch-depth: 0
      - name: Preserve the newer main branch and resolve only reviewed conflicts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = d6d7ab6e47a23a22dea7f1899b4d65e88ae03d86
          git merge --no-commit --no-ff origin/main || test -n "$(git ls-files -u)"
          python - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert paths <= {'Vision.html','index.html','web/build.py','vision-pc/server.py','vision-pc/Setup-Vision-PC.ps1'}, paths
          PY
          git checkout origin/main -- Vision.html index.html
          python .vision-integrate-launch.py
          python -m compileall -q vision-pc
          mkdir -p test-results
          python web/build.py | tee test-results/build.log
          git add web vision-pc tests Vision.html index.html
          test -z "$(git ls-files -u)"
      - name: Install test dependencies
        run: |
          python -m pip install -r vision-pc/requirements.txt
          python -m pip install 'python-docx==1.2.0' 'python-pptx==1.0.2' 'openpyxl==3.1.5' 'pdfplumber>=0.11,<1' 'pypdfium2>=5,<6' 'pytesseract==0.3.13' 'defusedxml==0.7.1'
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          BIN=$(node -e "console.log(require('playwright').chromium.executablePath())")
          echo "CHROME=$BIN" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$BIN" >> "$GITHUB_ENV"
      - name: Backend regressions including guest document isolation
        run: |
          set -o pipefail
          python -m unittest discover -s vision-pc -p 'test_*.py' -v 2>&1 | tee test-results/backend.log
      - name: JavaScript regressions
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          { for test in tests/*.test.cjs tests/base-account-races.cjs; do node "$test" || exit $?; done; } 2>&1 | tee test-results/javascript.log
      - name: Google, guest trial and document mobile browser checks
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          { node tests/account-gate-smoke.cjs && node tests/launch-trial-smoke.cjs && node tests/documents-smoke.cjs; } 2>&1 | tee test-results/browser.log
      - name: Capture generated sources and screens for review
        if: always()
        run: |
          mkdir -p test-results
          cp ../documents-mobile-test.png test-results/ 2>/dev/null || true
          tar --exclude='__pycache__' -czf test-results/verified-sources.tar.gz web vision-pc tests Vision.html index.html
      - name: Save verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-launch-verification
          path: test-results/
          retention-days: 3
      - name: Commit verified integration to the feature branch only
        if: success()
        run: |
          git rm .vision-integrate-launch.py .github/workflows/verify-launch-integration.yml
          git add web vision-pc tests Vision.html index.html
          git commit -m 'Integrate verified five-minute guest trial with document processing (v1.0.0.4)'
          git push origin HEAD:launch-guest-five-minutes
