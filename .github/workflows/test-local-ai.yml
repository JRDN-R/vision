name: Test local Qwen integration
on:
  pull_request:
    paths: ['vision-pc/**','web/**','tests/**','.github/workflows/test-local-ai.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-provider:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r vision-pc/requirements.txt
      - run: python -m unittest discover -s vision-pc -p 'test_local_*.py' -v
      - run: python -m unittest discover -s vision-pc -p test_context_compression.py -v
      - run: node --test tests/venture-local.test.cjs tests/rag-export.test.cjs
      - name: Windows PowerShell 5.1 syntax and transfer-copy verification
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'vision-pc/Local-AI.ps1'), [ref]$Tokens, [ref]$Errors) | Out-Null
          if ($Errors.Count) { $Errors | Format-List; throw 'PowerShell parse failed' }
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'vision-pc/Qwen-Ultra.ps1'), [ref]$Tokens, [ref]$Errors) | Out-Null
          if ($Errors.Count) { $Errors | Format-List; throw 'Ultra PowerShell parse failed' }
          if ((Get-FileHash vision-pc/Local-AI.ps1).Hash -ne (Get-FileHash vision-pc/Local-AI.txt).Hash) { throw 'Transfer copy differs' }
          & ./tests/test-local-ai-installer.ps1
