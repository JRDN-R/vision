name: Test video uploads

on:
  push:
    branches: [main]
    paths:
      - 'vision-pc/**'
      - 'web/video-preview.js'
      - 'web/video-preview.css'
      - '.github/workflows/test-video-uploads.yml'
  pull_request:
    branches: [main]
    paths: ['vision-pc/**', 'web/**', 'tests/*processing*', 'tests/queue-indicator.test.cjs', '.github/workflows/test-video-uploads.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check browser upload JavaScript
        run: node --check web/video-preview.js
      - name: Install FUPCJ Server test dependencies
        run: python -m pip install --disable-pip-version-check -r vision-pc/requirements.txt
      - name: Run uploaded video tests
        working-directory: vision-pc
        run: python -m unittest -v test_uploaded_media test_frame_analysis test_project_naming test_background_upload test_server test_trials test_account_administration

      - name: Browser contracts
        run: node --test tests/*.test.cjs
      - name: Build portable app
        run: python web/build.py
      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify phone and desktop settings and activity
        run: python tests/processing-browser.py
