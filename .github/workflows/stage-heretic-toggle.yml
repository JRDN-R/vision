name: Stage reviewed Heretic toggle
on:
  push:
    branches: [feature/qwen-heretic-toggle-20261012]
    paths: [.heretic-stage.txt]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'JRDN-R/vision' && github.ref == 'refs/heads/feature/qwen-heretic-toggle-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-bound source changes
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          encoded = ''.join(pathlib.Path(f'.heretic-stage-{i}.txt').read_text().strip() for i in range(1,5))
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '8edfd4b116c1ffddb3170265fc6a38c811f5f6302f68a4631a465bb2bc763dd9'
          changes = json.loads(raw)
          for change in changes:
              path = pathlib.Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('docs','tests','vision-pc','web')
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == change['before'], str(path)
              text = old.decode('utf-8')
              for i, j, replacement in reversed(change['edits']):
                  assert 0 <= i <= j <= len(text)
                  text = text[:i] + replacement + text[j:]
              new = text.encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == change['after'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          PY
      - run: python -m pip install -r vision-pc/requirements.txt
      - name: Local provider and variant regression tests
        run: python -m unittest discover -s vision-pc -p 'test_local_*.py' -v
      - name: Frontend regression tests
        run: node --test tests/venture-local.test.cjs
      - name: Commit verified source on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qwen-heretic-toggle.md tests/venture-local.test.cjs vision-pc web/venture-local.js web/venture-models.js web/venture.js
          git rm .heretic-stage.txt .heretic-stage-1.txt .heretic-stage-2.txt .heretic-stage-3.txt .heretic-stage-4.txt
          git diff --cached --check
          git commit -m 'feat(venture): add optional pinned Qwen Heretic model toggle'
          git push origin HEAD:feature/qwen-heretic-toggle-20261012
