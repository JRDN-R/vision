name: Stage reviewed Heretic toggle
on:
  push:
    branches: [feature/qwen-heretic-toggle-20261012]
    paths: [.heretic-stage.txt]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'JRDN-R/vision' && github.ref == 'refs/heads/feature/qwen-heretic-toggle-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-bound source patch
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = pathlib.Path('.heretic-stage.txt').read_text().strip()
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'db3b06dcaa1531ae30bd94ae753f1228e0a71f873b3f94297dc0b64bbdcde75a'
          path = pathlib.Path('/tmp/heretic-feature.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          PY
      - run: python -m pip install -r vision-pc/requirements.txt
      - name: Local provider and variant regression tests
        run: python -m unittest discover -s vision-pc -p 'test_local_*.py' -v
      - name: Frontend regression tests
        run: node --test tests/venture-local.test.cjs tests/venture-models.test.cjs
      - name: Commit verified source on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qwen-heretic-toggle.md tests/venture-local.test.cjs vision-pc web/venture-local.js web/venture-models.js web/venture.js
          git rm .heretic-stage.txt
          git diff --cached --check
          git commit -m 'feat(venture): add optional pinned Qwen Heretic model toggle'
          git push origin HEAD:feature/qwen-heretic-toggle-20261012
