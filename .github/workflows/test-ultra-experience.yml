name: Verify Ultra experience
on:
  pull_request:
    branches: [main]
    paths: ['web/**', 'vision-pc/**', 'tests/**', '.github/workflows/test-ultra-experience.yml']
permissions:
  contents: read
jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r vision-pc/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s vision-pc -p 'test_local_*.py' -q
      - run: python -m unittest discover -s vision-pc -p test_venture.py -q
      - run: node --test tests/venture-local.test.cjs tests/venture-pending.test.cjs
      - run: python tests/venture-ultra-browser.py
      - run: python tests/venture-response-motion.py
      - run: python tests/venture-progress-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultra-experience
          path: tests/venture-screenshots/qwen-ultra-*.png
          retention-days: 7
