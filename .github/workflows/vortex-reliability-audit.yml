name: Vortex retrieval audit
on:
  push:
    branches: [fix/vortex-instagram-signed-cdn-20261010]
    paths: [.github/workflows/vortex-reliability-audit.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download isolated public test dependencies
        run: python -m pip download --only-binary=:all: --no-deps --dest wheelhouse flask werkzeug blinker yt-dlp gallery-dl instaloader
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-test-wheels
          path: wheelhouse
          retention-days: 1
          if-no-files-found: error
