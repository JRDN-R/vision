name: Verify local context engine

on:
  pull_request:
    branches: [main]
    paths: ['vision-pc/**', 'web/intelligent-context.js', 'tests/*context*', '.github/workflows/test-context.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      PYTHONWARNINGS: ignore::ResourceWarning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies (no model or paid service)
        run: python -m pip install -r vision-pc/requirements.txt
      - name: Context, isolation, billing and installer tests
        run: python -m unittest discover -s vision-pc -p 'test_context*.py' -v
      - name: Backup integrity and offline setup tests
        run: python -m unittest discover -s tests -p 'test_context_setup.py' -v
      - name: Frontend context contract
        run: node tests/intelligent-context.test.cjs
      - name: Validate Windows staging and rollback scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/context-installer-windows.ps1
