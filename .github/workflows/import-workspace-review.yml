name: Prepare workspace regression dependencies
on:
  push:
    branches: [feature/venture-workspace-recovery]
    paths: ['.github/workflows/import-workspace-review.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package test dependencies only
        run: |
          python -m pip install --target /tmp/vision-test-deps --no-compile 'Flask>=3.1,<4' 'waitress>=3,<4' 'PyJWT>=2.10,<3' 'yt-dlp[default]>=2025.11.12'
          tar -czf /tmp/vision-test-deps.tar.gz -C /tmp/vision-test-deps .
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-test-deps
          path: /tmp/vision-test-deps.tar.gz
          retention-days: 1
