name: Recover interrupted workspace work
on:
  push:
    branches: [feature/venture-workspace-recovery]
    paths: ['.github/workflows/import-workspace-review.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recover complete patch entries without changing source
        run: |
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          value=Path('maintenance/venture-workspace.part-1.b64').read_text().strip()
          data=zlib.decompressobj(31).decompress(base64.b64decode(value))
          Path('/tmp/recovered-partial.patch').write_bytes(data)
          chunks=data.split(b'diff --git ')
          Path('/tmp/recovered-complete.patch').write_bytes(b''.join(b'diff --git '+chunk for chunk in chunks[1:-1]))
          print('Recovered',len(data),'bytes;',len(chunks)-2,'complete file entries')
          print('\n'.join(chunk.split(b'\n')[0].decode() for chunk in chunks[1:]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-recovered
          path: /tmp/recovered-*.patch
          retention-days: 3
