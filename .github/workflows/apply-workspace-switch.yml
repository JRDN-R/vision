name: Apply responsive Vision-Venture switch

on:
  push:
    branches:
      - feature/workspace-lottie-switch-all-screens-20261014
    paths:
      - scripts/enable-workspace-switch-desktop.py
      - .github/workflows/apply-workspace-switch.yml
      - tests/workspace-switch-layout.py
      - tests/compact-navigation.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch the existing bundled app
        run: |
          python3 scripts/enable-workspace-switch-desktop.py
          python3 -m py_compile scripts/enable-workspace-switch-desktop.py tests/workspace-switch-layout.py tests/compact-navigation.py
          git diff --check
      - name: Install browser test runtime
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify desktop and mobile workspace navigation
        run: |
          python3 tests/workspace-switch-layout.py
          python3 tests/compact-navigation.py
      - name: Save workspace switch screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-switch-screenshots
          path: tests/venture-screenshots/
          retention-days: 3
      - name: Commit the generated bundle change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Vision.html
          if ! git diff --cached --quiet; then
            git commit -m "Enable animated workspace switch across mobile and desktop"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
